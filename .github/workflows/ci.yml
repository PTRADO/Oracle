# ============================================================================
# ORACLE — intégration continue (lint + tests)
#
# Tourne sur chaque push et chaque PR. Ne touche JAMAIS au réseau : les tests
# s'appuient sur des extraits réels d'archives FDJ commités dans
# tests/fixtures/. Une panne FDJ ne doit pas faire rougir la CI.
#
# Le moteur reste stdlib pure : pytest et ruff sont des dépendances de DEV,
# installées ici et nulle part ailleurs.
# ============================================================================

name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch: {}

jobs:
  qualite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Dépendances de dev
        run: python -m pip install --quiet pytest ruff

      - name: Lint (ruff)
        run: ruff check .

      - name: Tests
        run: python -m pytest tests/ -q

      - name: Le moteur doit rester stdlib pure
        run: |
          python - <<'PY'
          import ast, sys, pathlib

          # Les modules du moteur ont le droit de s'importer entre eux : ils
          # sont vérifiés ici au même titre. Tout le reste doit être stdlib.
          MOTEUR = ["oracle.py", "recherche.py"]
          LOCAUX = {p.stem for p in pathlib.Path(".").glob("*.py")}
          STDLIB = set(sys.stdlib_module_names)

          faute = False
          for nom in MOTEUR:
              arbre = ast.parse(pathlib.Path(nom).read_text(encoding="utf-8"))
              importes = set()
              for n in ast.walk(arbre):
                  if isinstance(n, ast.Import):
                      importes |= {a.name.split(".")[0] for a in n.names}
                  elif isinstance(n, ast.ImportFrom) and n.level == 0 and n.module:
                      importes.add(n.module.split(".")[0])
              hors = sorted(importes - STDLIB - LOCAUX)
              if hors:
                  print(f"✗ {nom} importe hors stdlib : {hors}")
                  faute = True
              else:
                  print(f"✔ {nom} — {len(importes)} imports, tous stdlib ou locaux")
          raise SystemExit(1 if faute else 0)
          PY
