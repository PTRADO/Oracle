# ============================================================================
# ORACLE — intégration continue (lint + tests)
#
# Tourne sur chaque push et chaque PR. Ne touche JAMAIS au réseau : les tests
# s'appuient sur des extraits réels d'archives FDJ commités dans
# tests/fixtures/. Une panne FDJ ne doit pas faire rougir la CI.
#
# Le moteur reste stdlib pure : pytest et ruff sont des dépendances de DEV,
# installées ici et nulle part ailleurs.
# ============================================================================

name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch: {}

jobs:
  qualite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Dépendances de dev
        run: python -m pip install --quiet pytest ruff

      - name: Lint (ruff)
        run: ruff check .

      - name: Tests
        run: python -m pytest tests/ -q

      - name: Le moteur doit rester stdlib pure
        run: |
          python - <<'PY'
          import ast, sys, pathlib
          STDLIB = set(sys.stdlib_module_names)
          arbre = ast.parse(pathlib.Path("oracle.py").read_text(encoding="utf-8"))
          externes = set()
          for n in ast.walk(arbre):
              if isinstance(n, ast.Import):
                  externes |= {a.name.split(".")[0] for a in n.names}
              elif isinstance(n, ast.ImportFrom) and n.level == 0 and n.module:
                  externes.add(n.module.split(".")[0])
          hors = sorted(externes - STDLIB)
          if hors:
              print(f"✗ oracle.py importe hors stdlib : {hors}")
              raise SystemExit(1)
          print(f"✔ {len(externes)} imports, tous stdlib")
          PY
