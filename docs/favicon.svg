<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512"
     role="img" aria-label="Oracle">
  <title>Oracle</title>
  <!-- La boule de tirage, son anneau d'or et le point rouge de « ORACLE. » -->
  <defs>
    <radialGradient id="o-bleu" gradientUnits="userSpaceOnUse" cx="20" cy="-20" r="330">
      <stop offset="0" stop-color="#4353FF" stop-opacity=".55"/>
      <stop offset="1" stop-color="#4353FF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="o-violet" gradientUnits="userSpaceOnUse" cx="528" cy="553" r="325">
      <stop offset="0" stop-color="#8B4DFF" stop-opacity=".52"/>
      <stop offset="1" stop-color="#8B4DFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="o-halo" gradientUnits="userSpaceOnUse" cx="256" cy="256" r="210">
      <stop offset="0" stop-color="#F0B952" stop-opacity=".26"/>
      <stop offset=".55" stop-color="#F0B952" stop-opacity=".10"/>
      <stop offset="1" stop-color="#F0B952" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="o-boule" gradientUnits="objectBoundingBox" cx=".34" cy=".29" r=".92">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset=".34" stop-color="#FAFCFF"/>
      <stop offset=".60" stop-color="#DFE6F3"/>
      <stop offset=".84" stop-color="#AAB6CE"/>
      <stop offset="1" stop-color="#6C7996"/>
    </radialGradient>
    <radialGradient id="o-eclat" gradientUnits="userSpaceOnUse" cx="222" cy="214" r="40">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".95"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="o-lisere" gradientUnits="objectBoundingBox" cx=".5" cy=".5" r=".5">
      <stop offset=".80" stop-color="#8B4DFF" stop-opacity="0"/>
      <stop offset="1" stop-color="#8B4DFF" stop-opacity=".26"/>
    </radialGradient>
    <linearGradient id="o-or" gradientUnits="userSpaceOnUse" x1="40" y1="470" x2="470" y2="40">
      <stop offset="0" stop-color="#A9721E"/>
      <stop offset=".5" stop-color="#F0B952"/>
      <stop offset="1" stop-color="#FFE9B4"/>
    </linearGradient>
    <linearGradient id="o-or-loin" gradientUnits="userSpaceOnUse" x1="40" y1="470" x2="470" y2="40">
      <stop offset="0" stop-color="#5F4718"/>
      <stop offset=".5" stop-color="#8E7038"/>
      <stop offset="1" stop-color="#A98F55"/>
    </linearGradient>
    <radialGradient id="o-rouge" gradientUnits="userSpaceOnUse" cx="433" cy="234" r="46">
      <stop offset="0" stop-color="#FF5A4E" stop-opacity=".55"/>
      <stop offset="1" stop-color="#FF5A4E" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="o-bille" gradientUnits="objectBoundingBox" cx=".36" cy=".30" r=".85">
      <stop offset="0" stop-color="#FF8C74"/>
      <stop offset=".45" stop-color="#FF5A4E"/>
      <stop offset="1" stop-color="#8E1E17"/>
    </radialGradient>
    <clipPath id="o-masque"><circle cx="256" cy="256" r="128"/></clipPath>
  </defs>

  <!-- nuit profonde + aurore -->
  <rect width="512" height="512" fill="#05070F"/>
  <rect width="512" height="512" fill="url(#o-bleu)"/>
  <rect width="512" height="512" fill="url(#o-violet)"/>
  <rect width="512" height="512" fill="url(#o-halo)"/>

  <g transform="rotate(-20 256 256)">
    <!-- moitié arrière de l'anneau -->
    <ellipse cx="256" cy="256" rx="205" ry="75" fill="none"
             stroke="url(#o-or-loin)" stroke-width="22"/>
  </g>

  <!-- la boule -->
  <circle cx="256" cy="256" r="128" fill="url(#o-boule)"/>
  <circle cx="256" cy="256" r="128" fill="url(#o-lisere)"/>
  <circle cx="256" cy="256" r="128" fill="url(#o-eclat)"/>

  <g transform="rotate(-20 256 256)">
    <!-- ombre portée de l'anneau sur la boule -->
    <path d="M51 256A205 75 0 0 0 461 256" fill="none" stroke="#0A1020"
          stroke-width="30" opacity=".30" clip-path="url(#o-masque)"/>
    <!-- moitié avant de l'anneau -->
    <path d="M51 256A205 75 0 0 0 461 256" fill="none"
          stroke="url(#o-or)" stroke-width="22"/>
  </g>

  <!-- le point rouge — la ponctuation de « ORACLE. » -->
  <rect width="512" height="512" fill="url(#o-rouge)"/>
  <circle cx="433" cy="234" r="22" fill="url(#o-bille)"/>
</svg>
